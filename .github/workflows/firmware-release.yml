name: firmware-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [default, minimal, no_texture, joystick, profile, no_macrocell]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fetch Pico SDK
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          git -C $HOME/pico-sdk submodule update --init --depth 1

      - name: Configure
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          cmake -S . -B build/${{ matrix.preset }} -G Ninja \
            -DPICO_BOARD=pico2 \
            -DPICOVOXEL_FEATURE_PRESET=${{ matrix.preset }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Rename artifacts
        run: |
          cd build/${{ matrix.preset }}
          mv PicoVoxel.uf2 PicoVoxel-${{ matrix.preset }}.uf2
        
      # Temporarily save the output of each preset as an artifact
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/PicoVoxel-${{ matrix.preset }}.uf2
          retention-days: 1

  # Create a Release for all builds at once after they have finished
  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.uf2
          generate_release_notes: true
          # draft: false
          # prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}