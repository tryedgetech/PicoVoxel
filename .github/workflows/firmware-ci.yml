name: firmware-ci

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [default, minimal, no_texture, joystick, profile, no_macrocell]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fetch Pico SDK
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          git -C $HOME/pico-sdk submodule update --init --depth 1

      - name: Configure
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          cmake -S . -B build/${{ matrix.preset }} -G Ninja \
            -DPICO_BOARD=pico2 \
            -DPICOVOXEL_FEATURE_PRESET=${{ matrix.preset }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/PicoVoxel.elf
            build/${{ matrix.preset }}/PicoVoxel.map
            build/${{ matrix.preset }}/PicoVoxel.uf2
          retention-days: 7